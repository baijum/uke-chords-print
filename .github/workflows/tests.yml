name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --cov

      - name: Build catalog PDFs
        run: ./generate_catalog.sh

      - name: Upload catalog PDFs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: catalog-pdfs
          path: catalog/pdf/*.pdf
          retention-days: 14

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Use the installed command and library
        working-directory: /tmp  # away from the source tree
        run: |
          /tmp/venv/bin/uke-chords-print C Am F G -t "Песни 歌" -o cli.pdf
          /tmp/venv/bin/python - <<'PY'
          import io
          import uke_chords_print as ukc

          buf = io.BytesIO()
          ukc.render_pdf(ukc.voicings("Am7") + [ukc.heading("한국어")], buf)
          data = buf.getvalue()
          assert data.startswith(b"%PDF-") and b"/FontFile2" in data
          assert ukc.voicings("C")[0].frets == "0003"
          print(ukc.__version__, ukc.__file__)
          PY

      - name: Test the unpacked sdist
        run: |
          mkdir /tmp/sdist
          tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          /tmp/venv/bin/pip install pytest
          cd /tmp/sdist && /tmp/venv/bin/python -m pytest -q -p no:cacheprovider

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
